name: Check browser pin for upstream OBS
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  propose-update:
    if: github.repository == 'Huihuing/obs-browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          path: browser
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Huihuing/obs-studio
          ref: master
          path: studio
          persist-credentials: false
          sparse-checkout: build-aux/fork
      - run: bash ../studio/build-aux/fork/prepare-upstream.sh
        working-directory: browser
        env:
          GH_TOKEN: ${{ github.token }}
